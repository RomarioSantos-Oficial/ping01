name: Build Windows App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/SectorFlow.LmuNetworkAnalyzer/SectorFlow.LmuNetworkAnalyzer.csproj

      - name: Build
        run: dotnet build src/SectorFlow.LmuNetworkAnalyzer/SectorFlow.LmuNetworkAnalyzer.csproj -c Release --no-restore

      - name: Publish self-contained Windows x64
        run: dotnet publish src/SectorFlow.LmuNetworkAnalyzer/SectorFlow.LmuNetworkAnalyzer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/win-x64

      - name: Copy scripts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/win-x64/scripts | Out-Null
          Copy-Item scripts/*.ps1 artifacts/win-x64/scripts/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SectorFlow-LMU-NetworkAnalyzer-win-x64
          path: artifacts/win-x64/
